<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Машинка на CSS</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(#bfe6f5 0 65%,#7eb66b 65% 73%,#494f59 73% 91%,#5b934d 91%);position:relative}body::before{content:"";position:absolute;top:9%;right:12%;width:80px;height:80px;border-radius:50%;background:#ffe48a;box-shadow:0 0 50px #fff5b5}body::after{content:"";position:absolute;left:0;right:0;top:83%;height:5px;background:repeating-linear-gradient(90deg,#fff5ce 0 65px,transparent 65px 120px)}.car{position:absolute;z-index:1;bottom:22%;left:0;width:200px;height:52px;background:#e64b46;border-radius:25px 35px 10px 10px;box-shadow:inset 0 -12px #c93435;animation:drive 4s ease-out forwards}.car::before,.car::after{content:"";position:absolute;top:15px;width:14px;height:12px;border-radius:4px;background:#ffe69a}.car::before{left:0;background:#a9222c}.car::after{right:0}.cabin{position:absolute;left:38px;top:-41px;width:114px;height:48px;border:8px solid #e64b46;border-bottom:5px solid #e64b46;border-radius:50px 40px 0 0;background:linear-gradient(90deg,#b5e9f5 0 47%,#e64b46 47% 54%,#b5e9f5 54%)}.wheels::before,.wheels::after{content:"";position:absolute;bottom:-17px;width:39px;height:39px;border:9px solid #272d35;border-radius:50%;background:#aeb8c5;box-shadow:inset 0 0 0 4px #dce3eb}.wheels::before{left:23px}.wheels::after{right:23px}@keyframes drive{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw - 250px))}}</style></head><body><div class="car" role="img" aria-label="Красная машинка"><div class="cabin"></div><div class="wheels"></div></div></body></html>
